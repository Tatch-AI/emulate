tokens:
  gho_test_token_admin:
    login: admin
    scopes: [repo, user, admin:org, admin:repo_hook]
  gho_test_token_octocat:
    login: octocat
    scopes: [repo, user, read:user, "user:email", workflow]

github:
  users:
    - login: octocat
      name: The Octocat
      email: octocat@github.com
      bio: I am the Octocat
      company: GitHub
      location: San Francisco
    - login: developer
      name: Developer
      email: dev@example.com
  orgs:
    - login: my-org
      name: My Organization
      description: A test organization
  repos:
    - owner: octocat
      name: hello-world
      description: My first repository
      language: JavaScript
      topics: [hello, world]
      auto_init: true
    - owner: my-org
      name: org-repo
      description: An organization repository
      language: TypeScript
      auto_init: true
  apps:
    - app_id: 12345
      slug: my-github-app
      name: My GitHub App
      private_key: |
        -----BEGIN RSA PRIVATE KEY-----
        ...your PEM key...
        -----END RSA PRIVATE KEY-----
      permissions:
        contents: read
        issues: write
      events: [push, pull_request, issues]
      webhook_url: http://localhost:3000/webhooks/github
      webhook_secret: my-webhook-secret
      installations:
        - installation_id: 100
          account: octocat
          repository_selection: all
  oauth_apps:
    - client_id: emu_github_client_id
      client_secret: emu_github_client_secret
      name: Code App
      redirect_uris:
        - http://localhost:3000/api/auth/callback/github

vercel:
  users:
    - username: developer
      name: Developer
      email: dev@example.com
  teams:
    - slug: my-team
      name: My Team
  projects:
    - name: my-app
      team: my-team
      framework: nextjs
  integrations:
    - client_id: emu_vercel_client_id
      client_secret: emu_vercel_client_secret
      name: Code App (Vercel)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/vercel

google:
  users:
    - email: testuser@gmail.com
      name: Test User
    - email: dev@example.com
      name: Developer
  oauth_clients:
    - client_id: emu_google_client_id
      client_secret: emu_google_client_secret
      name: Code App (Google)
      redirect_uris:
        - http://localhost:3000/api/auth/callback/google
  labels:
    - id: Label_ops
      user_email: testuser@gmail.com
      name: Ops/Review
      color_background: "#DDEEFF"
      color_text: "#111111"
  messages:
    - id: msg_welcome
      user_email: testuser@gmail.com
      from: welcome@example.com
      to: testuser@gmail.com
      subject: Welcome to the Gmail emulator
      body_text: You can now test Gmail, Calendar, and Drive flows locally.
      label_ids:
        - INBOX
        - UNREAD
        - CATEGORY_UPDATES
      date: 2025-01-04T10:00:00.000Z
  calendars:
    - id: primary
      user_email: testuser@gmail.com
      summary: testuser@gmail.com
      primary: true
      selected: true
      time_zone: UTC
  calendar_events:
    - id: evt_kickoff
      user_email: testuser@gmail.com
      calendar_id: primary
      summary: Project Kickoff
      start_date_time: 2025-01-10T09:00:00.000Z
      end_date_time: 2025-01-10T09:30:00.000Z
  drive_items:
    - id: drv_docs
      user_email: testuser@gmail.com
      name: Docs
      mime_type: application/vnd.google-apps.folder
      parent_ids:
        - root

openai:
  api_keys:
    - sk-test-openai
  responses:
    - match:
        content_contains: ping
      reply: pong
  transcripts:
    - filename_contains: greeting
      text: Hello from the OpenAI emulator.

anthropic:
  api_keys:
    - sk-ant-test-key
  responses:
    - match:
        content_contains: ping
      reply: pong

posthog:
  project:
    id: 1
    name: Local Project
    api_key: phc_test_key
  personal_api_keys:
    - phx_test_personal
  feature_flags:
    - key: new-dashboard
      active: true
      filters:
        groups:
          - properties: []
            rollout_percentage: 100
  persons:
    - distinct_ids: [user_1]
      properties:
        email: test@example.com

openphone:
  api_keys:
    - key: op_test_api_key
      name: Local API Key
  users:
    - first_name: Test
      last_name: User
      email: test@example.com
      role: owner
  phone_numbers:
    - number: "+15551230000"
      name: Local OpenPhone Number
      users: [test@example.com]
  custom_fields:
    - key: account-id
      name: Account ID
      type: string

knock:
  api_keys:
    - sk_test_knock
    - pk_test_knock
  channels:
    - key: in-app
      type: in_app_feed
      name: In-App Feed
    - key: email
      type: email
      name: Email
  workflows:
    - key: welcome
      name: Welcome
      steps:
        - channel: in-app
          template:
            body: "Welcome, {{ recipient.name }}!"
        - channel: email
          template:
            subject: Welcome
            body: "Hi {{ recipient.name }}"
  users:
    - id: user_1
      name: Test User
      email: test@example.com

deepgram:
  api_keys:
    - deepgram_test_key
  projects:
    - name: Local Project
  transcripts:
    - match:
        url_contains: greeting
      text: Hello from the Deepgram emulator.
